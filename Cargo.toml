[package]
name = "foxhole"
version = "0.1.9"
edition = "2021"
description = "System-wide DNS ad blocker for Linux (AdGuard-style lists, Hagezi Pro++ by default)"

[[bin]]
name = "foxhole"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hickory-proto = "0.26"
# rustls: pure Rust TLS, so there's no OpenSSL to install or link against. Certificates are checked
# against the system's trust store (/etc/ssl/certs), like the Windows build uses the Windows store.
# rustls negotiates ALPN itself, so concurrent DoH queries share one HTTP/2 connection.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util", "fs"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
